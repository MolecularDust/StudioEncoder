[package]
name = "studioencoder-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "studioencoder_rs"
crate-type = ["staticlib"]

[dependencies]
# FilmCraft ProRes crate, pinned to a reviewed commit (MIT OR Apache-2.0)
filmcraft-prores = { git = "https://github.com/storytold/filmcraft", rev = "68919ed87aa6a097a4d21414ec7c438883f5fe22" }

# OxideAV pure-Rust ProRes encoder (MIT), pinned to exact versions
oxideav-prores = "=0.1.1"
oxideav-core = "=0.1.42"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
