name: Build StudioEncoder

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025-vs2026
            rust-target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-vs2026-arm
            rust-target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.rust-target }}
          rustup default stable
      - name: Configure
        run: cmake --preset windows-${{ matrix.arch }}
      - name: Build
        run: cmake --build build_${{ matrix.arch }} --config Release --parallel
      - name: Stage portable plugin
        run: cmake --install build_${{ matrix.arch }} --config Release --prefix staging/plugins
      - uses: actions/upload-artifact@v4
        with:
          name: obs-studioencoder-windows-${{ matrix.arch }}
          path: staging/
          if-no-files-found: error

  linux:
    name: Ubuntu x86-64
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config obs-studio qt6-base-dev \
            libsimde-dev libavcodec-dev libavutil-dev libavformat-dev libswscale-dev libvpl-dev
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Configure and build
        run: |
          cmake --preset ubuntu-x86_64
          cmake --build --preset ubuntu-x86_64
      - name: Package plugin
        run: |
          cmake --install build_x86_64 --prefix /usr --strip
          tar -C staging -czf obs-studioencoder-linux-x86_64.tar.gz usr
        env:
          DESTDIR: ${{ github.workspace }}/staging
      - uses: actions/upload-artifact@v4
        with:
          name: obs-studioencoder-linux-x86_64
          path: obs-studioencoder-linux-x86_64.tar.gz
          if-no-files-found: error
