Plugin.Name="StudioEncoder"
Plugin.Description="Unofficial ProRes-compatible video encoders (FFmpeg, FilmCraft and OxideAV), an H.264 10-bit 4:2:2 intra encoder for NVIDIA RTX 50 series and an HEVC 10-bit intra encoder for AMD Radeon. Not Apple ProRes."
Encoder.Rust="SE: ProRes-compatible (Rust / FilmCraft) (experimental)"
Encoder.OxideAV="SE: ProRes (OxideAV, pure Rust) (experimental)"
Encoder.FFmpeg="SE: ProRes (FFmpeg prores_ks) (experimental)"
Encoder.FFmpegAw="SE: ProRes (FFmpeg prores_aw, original) (experimental)"
Encoder.AwPlus="SE: ProRes (AW+, fast)"
Encoder.NvencH264="SE: H.264 10-bit 4:2:2 Intra (NVIDIA NVENC, RTX 50 series)"
Info.Requirements="Required video settings"
Info.Text="Settings > Advanced > Color Format: P216. Color Space: Rec. 709. Color Range: Limited."
Profile="Profile"
Profile.Proxy="Proxy (apco)"
Profile.LT="LT (apcs)"
Profile.422="422 (apcn)"
Profile.HQ="HQ (apch)"
Threads="Threads"
Threads.Description="0 = automatic. Used for slice threading when only one frame is in flight. Rust backend: 1 disables parallel slice encoding."
InFlight="Frames in flight (0 = automatic)"
InFlight.Description="How many frames are encoded at the same time, each on its own CPU core. 0 (automatic) starts with half the logical CPUs and adds workers whenever frames fall behind, up to one per logical CPU, More frames in flight use more memory (roughly 40-80 MB each at 4K) but never cost frames when recording stops."
QScale="Quality (qscale)"
QScale.Description="0 = profile default. 1 (best) to 31 (smallest) overrides the per-profile data rate."
Vendor.Apl0="Write Apple vendor tag (apl0)"
LogLevel="Log verbosity"
LogLevel.Errors="Errors"
LogLevel.Warnings="Warnings"
LogLevel.Info="Info"
LogLevel.Debug="Debug (every frame)"
Error.WrongFormat="This encoder needs Settings > Advanced > Color Format set to P216 (Rec. 709, Limited)."
Error.BadSize="Unsupported video size. The width must be even."
Error.CreateFailed="Could not create the encoder. See the OBS log for details."
Overload="On overload"
Overload.Warn="Warn in the log"
Overload.Stop="Stop recording"
Overload.Description="When this encoder cannot keep up, OBS repeats the previous frame and the recording looks frozen. Either way the plugin writes an OVERLOAD warning to the log every second it happens and a summary at the end. 'Stop recording' also ends the recording after 3 overloaded seconds in a row."
Error.Overload="Recording stopped: the encoder could not keep up and OBS was repeating frames. Use a lighter profile or a lower resolution; SE: ProRes (AW+, fast) is the lightest ProRes encoder."
Sizing="Automatic sizing"
Sizing.Late="Grow when frames are late"
Sizing.Measured="Size from measured frame cost (experimental)"
Sizing.Description="Only used when Frames in flight is 0. 'Grow when frames are late' starts with half the logical CPUs and adds one worker at a time while frames arrive late. 'Size from measured frame cost' starts with 4 workers, times the first frames, then sets the number of workers needed in one step (frame rate x time per frame, plus a margin). It uses fewer workers and less memory for light encoders and ramps up faster for heavy ones. CPU load is the same either way: it depends on the encoder and profile, not on the number of workers."
NvBitrate="Bitrate"
NvBitrate.Description="Every frame is a keyframe, so this sets the file size directly. 100 Mbit/s = small files (about ProRes LT quality), 200 = default (better than ProRes LT, about half the size of ProRes 422), 300 = high quality. Above 400 adds nothing."
NvPreset="Speed"
NvPreset.Quality="Quality (p5)"
NvPreset.Fast="Fast (p1, slightly lower quality)"
Settings.Menu="StudioEncoder"
Settings.Title="StudioEncoder settings"
Settings.Intro="Choose which encoders appear in OBS's encoder list (Settings > Output). Changes take effect after you restart OBS. An encoder that a profile already uses keeps working even if it is switched off here."
Settings.Version="Plugin version %1"
Settings.Recommended="Recommended"
Settings.Experimental="Experimental"
Settings.ExperimentalNote="These are slower, heavier on the CPU or less tested. They are off by default and meant for testing."
Settings.Restart="Restart OBS for the change to take effect."
Desc.FFmpegAw="FFmpeg's original prores_aw. Its Proxy comes out blurry; kept for comparison with AW+."
Desc.AwPlus="Light on the CPU. The recommended ProRes encoder: prores_aw with corrected rounding, so Proxy keeps fine detail like Apple's ProRes."
Desc.NvencH264="Smaller files, encoded on the GPU. Needs an NVIDIA RTX 50-series card."
Desc.FFmpeg="Very heavy on the CPU at 4K."
Desc.Rust="Heavy on the CPU and makes the largest files. Keeps up only on fast CPUs."
Desc.OxideAV="About twice the CPU of prores_aw with no quality gain. Very new code."
Settings.Unavailable="Not available here: this GPU cannot encode H.264 10-bit 4:2:2."
Source.P210="SE: 10-bit 4:2:2 capture (P210)"
P210.Device="Device"
P210.Device.Auto="First device that offers P210"
P210.Resolution="Resolution"
P210.FrameRate="Frame rate"
P210.ColorSpace="Color space"
P210.ColorRange="Color range"
P210.Range.Limited="Limited"
P210.Range.Full="Full"
P210.Info="Captures 10-bit 4:2:2 (P210) from cards that offer it, such as Magewell Pro Capture, with no conversion. Match the resolution and frame rate to the camera's HDMI signal. To keep the 10 bits, set Settings > Advanced > Color Format to P216. Add the card's audio with a separate Audio Input Capture source."
Encoder.AmdHevc="SE: HEVC 10-bit Intra (AMD)"
Desc.AmdHevc="10-bit 4:2:0 with every frame a keyframe, encoded on the graphics card, so it edits smoothly. Choose a quality preset instead of tuning bitrates. Needs a Radeon card and Color Format P010."
Settings.UnavailableAmd="Not available here: no AMD graphics card with HEVC 10-bit encoding was found."
Info.TextP010="Settings > Advanced > Color Format: P010. Color Space: Rec. 709. Color Range: Limited."
Error.WrongFormatP010="This encoder needs Settings > Advanced > Color Format set to P010 (Rec. 709, Limited)."
AmdQuality="Quality"
AmdQuality.Small="Small (about 30 Mbit/s at 4K 30p)"
AmdQuality.Standard="Standard (about 70 Mbit/s, near ProRes LT quality)"
AmdQuality.High="High (about 120 Mbit/s, default)"
AmdQuality.Maximum="Maximum (about 170 Mbit/s)"
AmdQuality.Description="Every frame is a keyframe and the quality is constant, so the file size depends on the picture: the Mbit/s figures are typical for 4K 29.97 camera footage, and noisy footage gives bigger files. In a test on one 4K camera clip, Standard measured about 1 dB below ProRes LT at 40% of its size, and High measured above ProRes LT at 70% of its size."
