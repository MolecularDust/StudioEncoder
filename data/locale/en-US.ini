Error.WrongFormat="This encoder needs Settings > Advanced > Color Format set to P216 (Rec. 709, Limited)."
Error.BadSize="Unsupported video size. The width must be even."
Error.CreateFailed="Could not create the encoder. See the OBS log for details."
Overload="On overload"
Overload.Warn="Warn in the log"
Overload.Stop="Stop recording"
Overload.Description="When this encoder cannot keep up, OBS repeats the previous frame and the recording looks frozen. Either way the plugin writes an OVERLOAD warning to the log every second it happens and a summary at the end. 'Stop recording' also ends the recording after 3 overloaded seconds in a row."
Error.Overload="Recording stopped: the ProRes encoder could not keep up and OBS was repeating frames. Use the prores_aw encoder, a lighter profile or a lower resolution."
