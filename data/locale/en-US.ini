Threads="Threads"
Threads.Description="0 = automatic. Used for slice threading when only one frame is in flight. Rust backend: 1 disables parallel slice encoding."
InFlight="Frames in flight (0 = automatic)"
InFlight.Description="How many frames are encoded at the same time, each on its own CPU core. 0 (automatic) starts with half the logical CPUs and adds workers whenever frames fall behind, up to one per logical CPU, More frames in flight use more memory (roughly 40-80 MB each at 4K) but never cost frames when recording stops."
QScale="Quality (qscale)"
QScale.Description="0 = profile default. 1 (best) to 31 (smallest) overrides the per-profile data rate."
